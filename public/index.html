<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#151821" />
  <link rel="icon" href="data:," />
  <title>Stealth Render Studio</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/recorder.css" data-recorder-css />
  <link rel="stylesheet" href="/css/scenarios.css" data-css="scenarios" />
  <!-- Уся логіка — ES-модулі в /js (без збірки). Точка входу: /js/app.js -->
  <script type="module" src="/js/app.js"></script>
</head>
<body data-pane="scenarios">
  <a class="skip-link" href="#viewer">До перегляду</a>

  <header class="app-header">
    <h1 class="brand"><span aria-hidden="true">🎭</span><span class="brand-text"> Stealth Render Studio</span></h1>
    <!-- Бейджі стану сервера: «лише в памʼяті», «● LIVE ×N», «сервер недоступний» (js/app.js) -->
    <div id="hdrHealth" class="hdr-health" aria-live="polite"></div>
    <span class="spacer"></span>
    <!-- Чип активного конфігу (рушій · пресет / кастом / ● змінено); клік відкриває конфігуратор -->
    <button id="hdrConfigChip" class="chip" type="button" aria-label="Активний конфіг — відкрити конфігуратор" title="Активний конфіг — відкрити конфігуратор">⚙ …</button>
    <button id="cfgBtn" class="btn btn-secondary btn-icon" type="button" aria-label="Відкрити конфігуратор" title="Конфігуратор контексту">⚙<span class="label"> Конфігуратор</span></button>
  </header>

  <input type="file" id="fileInput" hidden />

  <!-- Каркас: ≥ 900 px — перегляд+логи зліва, сценарії справа; < 900 px — одна панель
       за раз (body[data-pane]) і нижня навігація #paneNav. -->
  <div class="workspace" id="workspace">
    <!-- Статус «що відбувається зараз» (setLive) — видно з будь-якої панелі -->
    <div class="live" id="live" role="status" aria-live="polite">Готово до роботи.</div>

    <main class="pane pane-viewer" id="paneViewer">
      <!-- #viewer: таби результатів + живий перегляд і тулбар запису (recorder.js) -->
      <section id="viewer" class="viewer-panel" aria-label="Перегляд">
        <div class="tabs-bar">
          <div class="tabs" id="tabs" role="tablist" aria-label="Скріни результатів"></div>
          <span class="tabs-count" id="tabsCount" aria-label="Скрінів (ліміт)"></span>
          <button id="tabsCloseAll" class="tabs-closeall" type="button" aria-label="Закрити всі скріни" title="Закрити всі скріни" hidden>✕ всі</button>
        </div>
        <div id="recToolbar" class="rec-toolbar" role="toolbar" aria-label="Запис" hidden></div>
        <div id="liveHost" class="live-host" hidden></div>
        <div id="resultView" class="result-view" role="tabpanel" aria-label="Скрін результату"></div>
      </section>
    </main>

    <section class="pane pane-logs console" id="console" aria-label="Логи">
      <div class="console-head">
        <span class="title" title="Що робить Playwright і що підставляється">🧾 Логи</span>
        <div class="console-filters" id="consoleFilters" role="group" aria-label="Фільтр логів за видом"></div>
        <div class="console-acts">
          <button id="consoleCopy" type="button" aria-label="Копіювати видимі логи" title="Копіювати видимі (за фільтром) рядки">⧉ копіювати</button>
          <button id="consoleClear" type="button" aria-label="Очистити логи" title="Очистити">🗑<span class="label"> очистити</span></button>
          <button id="consoleToggle" type="button" aria-label="Згорнути логи" aria-expanded="true" aria-controls="consoleBody">▾</button>
        </div>
      </div>
      <div class="console-wrap">
        <div class="console-body" id="consoleBody" role="log" aria-live="polite" tabindex="0" aria-label="Рядки логу"></div>
        <button id="consoleJump" class="console-jump" type="button" hidden>↓ нові рядки</button>
      </div>
    </section>

    <aside class="pane pane-scenarios sidebar" id="paneScenarios" aria-label="Сценарії">
      <div id="sbResizer" class="sb-resizer" role="separator" aria-orientation="vertical" aria-label="Ширина панелі сценаріїв (стрілки ←/→, подвійний клік — скинути)" tabindex="0"></div>
      <div class="sb-head">
        <button id="newPageBtn" class="btn btn-primary" type="button">➕ Новий сценарій</button>
      </div>
      <div class="sb-title">
        <span>Сценарії → Дії → під-дії</span>
      </div>
      <div class="recs" id="pagesEl"></div>
    </aside>

    <!-- < 900 px: перемикач панелей (знизу, під великий палець) -->
    <nav class="pane-nav" id="paneNav" role="tablist" aria-label="Панелі">
      <button type="button" role="tab" data-pane="scenarios" aria-controls="paneScenarios" aria-selected="true">
        <span class="pn-ico" aria-hidden="true">📋</span><span class="pn-label">Сценарії</span><span class="nav-badge" hidden></span>
      </button>
      <button type="button" role="tab" data-pane="viewer" aria-controls="paneViewer" aria-selected="false" tabindex="-1">
        <span class="pn-ico" aria-hidden="true">🖼</span><span class="pn-label">Перегляд</span><span class="nav-badge" hidden></span>
      </button>
      <button type="button" role="tab" data-pane="logs" aria-controls="console" aria-selected="false" tabindex="-1">
        <span class="pn-ico" aria-hidden="true">🧾</span><span class="pn-label">Логи</span><span class="nav-badge" hidden></span>
      </button>
    </nav>
  </div>

  <!-- Конфігуратор -->
  <dialog id="cfgDialog" class="modal cfg-modal" aria-labelledby="cfgTitle">
    <div class="modal-head">
      <h2 id="cfgTitle">⚙ Конфігуратор</h2>
      <button id="cfgClose" class="x" type="button" aria-label="Закрити конфігуратор">✕</button>
    </div>
    <div class="cfg-presets" id="cfgPresets" role="group" aria-label="Пресети"></div>
    <div id="cfgAlert" class="cfg-alert" role="alert" hidden></div>
    <div class="cfg-wrap">
      <div class="cfg-nav" id="cfgNav" role="tablist" aria-label="Категорії"></div>
      <div class="cfg-main" id="cfgBody" role="tabpanel" tabindex="-1">завантаження…</div>
    </div>
    <div class="modal-foot cfg-foot">
      <button id="cfgExport" class="btn btn-ghost" type="button" title="Експорт застосованого конфігу в Markdown (специфікація + готовий client.mjs) — щоб Claude чи людина відтворили клієнт">📤<span class="cfg-export-label"> Експорт</span></button>
      <span id="cfgHint" class="cfg-hint" aria-live="polite"></span>
      <div class="cfg-foot-acts">
        <button id="cfgSaveNew" class="btn btn-secondary" type="button" hidden>➕ Зберегти як новий пресет</button>
        <button id="cfgUpdatePreset" class="btn btn-secondary" type="button" hidden>💾 Оновити пресет</button>
        <button id="cfgSave" class="btn btn-primary" type="button">Застосувати</button>
      </div>
    </div>
    <div id="cfgBusy" class="cfg-busy" hidden><span class="spinner" aria-hidden="true"></span><span class="busy-text">Застосовую…</span></div>
  </dialog>

  <!-- Корінь для <dialog>-діалогів (prompt/confirm/форми) — див. js/dialogs.js -->
  <div id="dialogs"></div>
  <!-- Тости (js/dialogs.js toast) -->
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
</body>
</html>
