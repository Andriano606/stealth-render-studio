<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><title>Хост з iframe</title>
<style>
  body { margin: 0; height: 3000px; font: 16px sans-serif; }
  #top { height: 1400px; background: #f6f6f6; }
  #f { display: block; width: 700px; height: 500px; border: 4px solid #888; padding: 6px; margin-left: 30px; }
  #f2 { display: block; width: 400px; height: 160px; margin: 40px 0 0 30px; }
</style></head>
<body>
  <!-- #f — крос-доменний iframe (інший порт = інший origin), з рамкою й паддінгом;
       #f2 — srcdoc. Кліки в iframe повідомляються батькові через postMessage. -->
  <div id="top">Головна сторінка</div>
  <iframe id="f" title="форма"></iframe>
  <iframe id="f2" title="srcdoc" srcdoc="<body style='margin:0'><button id='sb' style='margin:40px;width:150px;height:40px'>srcdoc</button><script>sb.onclick=()=>parent.postMessage('srcdoc','*')</script></body>"></iframe>
  <script>
    window.clicks = [];
    addEventListener('message', (e) => window.clicks.push(e.data));
    document.getElementById('f').src = new URLSearchParams(location.search).get('child') || 'about:blank';
  </script>
</body>
</html>
