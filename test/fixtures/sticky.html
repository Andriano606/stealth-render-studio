<!doctype html><html><head><meta charset="utf-8"><title>Sticky-сайдбар</title>
<!-- position:sticky; top:20px (природний top 200): на прокрученій сторінці «прилиплий» сайдбар накриває точки першого екрана. -->
<style>
body{margin:0;font:16px sans-serif}
.row{display:flex;height:3000px}
aside{position:sticky;top:20px;align-self:flex-start;margin-top:200px;width:220px}
aside a{display:block;height:60px;line-height:60px;background:#eef;border-bottom:1px solid #99a}
main{flex:1;position:relative}
#low{position:absolute;left:300px;top:2400px;width:200px;height:50px}
</style></head><body><div class="row"><aside>
<a href="#" id="l0">L0</a><a href="#" id="l1">L1</a><a href="#" id="l2">L2</a><a href="#" id="l3">L3</a><a href="#" id="l4">L4</a><a href="#" id="l5">L5</a>
</aside><main><button id="low">Low</button></main></div>
<script>window.clicks=[];document.querySelectorAll('a,button').forEach(e=>e.addEventListener('click',ev=>{ev.preventDefault();clicks.push(e.id)}))</script>
</body></html>
