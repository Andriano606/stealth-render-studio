<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Фікстура кліків</title>
<style>
  body { margin: 0; height: 3000px; font: 16px sans-serif; }
  button { position: absolute; left: 100px; width: 200px; height: 50px; }
  #top { top: 150px; }
  #low { top: 2400px; }
  #name { position: absolute; left: 100px; top: 300px; width: 300px; height: 30px; }
</style>
</head>
<body>
  <h1>Фікстура для e2e</h1>
  <button id="top">Верхня</button>
  <input id="name" placeholder="Імʼя">
  <button id="low">Нижня</button>
  <pre id="log"></pre>
  <script>
    window.clicks = [];
    for (const id of ['top', 'low']) document.getElementById(id).addEventListener('click', () => window.clicks.push(id));
  </script>
</body>
</html>
